<div class="app">

  <header class="topbar">
    <button class="brand" data-action="go" data-view="home" aria-label="نَغَم ستوديو — الصفحة الرئيسية">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><g fill="currentColor"><rect x="4.5" y="9" width="3" height="6" rx="1.5"/><rect x="10.5" y="4.5" width="3" height="15" rx="1.5"/><rect x="16.5" y="10.5" width="3" height="3" rx="1.5"/></g></svg>
      </span>
      <span class="brand-name"><span id="brandLabel">نَغَم</span><span class="brand-chip">STUDIO</span></span>
    </button>

    <div class="hist">
      <button class="icon-btn" data-action="back" aria-label="رجوع" data-i18n-aria="nav.back"><svg class="ic flip" aria-hidden="true"><use href="#i-chevron-right"></use></svg></button>
      <button class="icon-btn" data-action="forward" aria-label="تقدُّم" data-i18n-aria="nav.forward"><svg class="ic flip" aria-hidden="true"><use href="#i-chevron-left"></use></svg></button>
    </div>

    <div class="search" id="searchWrap" role="search">
      <svg aria-hidden="true"><use href="#i-search"></use></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="ابحث عن أغنية أو فنان" aria-label="بحث" data-i18n-ph="search.placeholder" data-i18n-aria="search.label">
      <kbd class="search-kbd" title="اختصار البحث">/</kbd>
      <button class="search-clear" id="qClear" data-action="clear-search" aria-label="مسح البحث" data-i18n-aria="search.clear" hidden><svg aria-hidden="true"><use href="#i-x"></use></svg></button>
    </div>

    <div class="top-actions">
      <button class="pill pill-accent" data-action="import" data-i18n-aria="top.importAria">
        <svg aria-hidden="true"><use href="#i-upload"></use></svg>
        <span class="pill-label" data-i18n="top.import">استيراد</span>
      </button>
      <button class="pill hide-md" data-action="go" data-view="studio">
        <span class="pill-dot" aria-hidden="true"></span>
        <span class="pill-label" data-i18n="top.customize">تخصيص</span>
      </button>
      <button class="icon-btn hide-md" data-action="shortcuts" aria-label="اختصارات لوحة المفاتيح" data-i18n-aria="top.shortcuts">
        <svg aria-hidden="true"><use href="#i-keyboard"></use></svg>
      </button>
      <button class="pill pill-ghost lang-pill" id="langBtn" data-action="lang" aria-label="Switch to English" data-i18n-aria="top.lang">EN</button>
      <button class="avatar" id="avatarBtn" data-action="go" data-view="library" aria-label="حسابك والمكتبة" data-i18n-aria="top.profile">ن</button>
    </div>
  </header>

  <div class="shell">

    <aside class="rail" aria-label="المكتبة">
      <nav class="rail-nav" aria-label="التنقل الرئيسي">
        <button class="rail-link is-active" data-action="go" data-view="home" data-nav="home">
          <svg aria-hidden="true"><use href="#i-home"></use></svg><span data-i18n="nav.home">الرئيسية</span>
        </button>
        <button class="rail-link" data-action="go" data-view="search" data-nav="search">
          <svg aria-hidden="true"><use href="#i-search"></use></svg><span data-i18n="nav.search">بحث</span>
        </button>
        <button class="rail-link" data-action="go" data-view="studio" data-nav="studio">
          <svg aria-hidden="true"><use href="#i-sliders"></use></svg><span data-i18n="nav.studio">الاستوديو</span>
        </button>
      </nav>

      <div class="rail-head">
        <h2 data-i18n="rail.library">مكتبتك</h2>
        <button class="rail-add" data-action="new-playlist" aria-label="قائمة تشغيل جديدة" data-i18n-aria="rail.new">
          <svg aria-hidden="true"><use href="#i-plus"></use></svg>
        </button>
      </div>

      <div class="rail-scroll" id="railList"></div>

      <div class="rail-foot">
        <span class="dot" aria-hidden="true"></span>
        <div class="rail-foot-text">
          <div class="rail-foot-title" data-i18n="rail.engine">محرك صوت تجريبي</div>
          <div class="rail-foot-sub" data-i18n="rail.engineSub">توليد حي • بدون تحميل</div>
        </div>
        <button class="icon-btn is-small" data-action="go" data-view="studio" aria-label="إعدادات الصوت" data-i18n-aria="rail.audioSettings">
          <svg aria-hidden="true"><use href="#i-monitor"></use></svg>
        </button>
      </div>
    </aside>

    <main class="stage" id="main" tabindex="-1">
      <div class="stage-bar">
        <div class="chips" id="genreChips" role="group" aria-label="تصفية حسب النوع"></div>
        <div class="stage-tools">
          <button class="icon-btn hide-md" data-action="toggle-panel" id="panelToggle" aria-label="إظهار لوحة التشغيل" aria-pressed="false" data-i18n-aria="nav.panel">
            <svg aria-hidden="true"><use href="#i-panel"></use></svg>
          </button>
        </div>
      </div>
      <div class="stage-scroll" id="scroll">
        <section class="view" data-view-section="home" id="view-home" aria-label="الرئيسية"></section>
        <section class="view" data-view-section="search" id="view-search" aria-label="البحث" hidden></section>
        <section class="view" data-view-section="library" id="view-library" aria-label="المكتبة" hidden></section>
        <section class="view" data-view-section="studio" id="view-studio" aria-label="الاستوديو" hidden></section>
        <section class="view" data-view-section="track" id="view-track" aria-label="صفحة الأغنية" hidden></section>
        <section class="view" data-view-section="playlist" id="view-playlist" aria-label="قائمة التشغيل" hidden></section>
        <section class="view" data-view-section="artist" id="view-artist" aria-label="صفحة الفنان" hidden></section>
        <section class="view" data-view-section="album" id="view-album" aria-label="صفحة الألبوم" hidden></section>
      </div>
    </main>

    <aside class="nowpanel" id="nowPanel" aria-label="يُشغَّل الآن">
      <div class="np-head">
        <div class="seg" role="tablist" aria-label="لوحة التشغيل">
          <button role="tab" data-action="np-tab" data-tab="now" aria-selected="true" data-i18n="panel.now">الآن</button>
          <button role="tab" data-action="np-tab" data-tab="queue" aria-selected="false" data-i18n="panel.queue">الانتظار</button>
          <button role="tab" data-action="np-tab" data-tab="lyrics" aria-selected="false" data-i18n="panel.lyrics">الكلمات</button>
        </div>
        <button class="icon-btn is-small" data-action="toggle-panel" aria-label="إخفاء اللوحة" data-i18n-aria="nav.panelClose">
          <svg aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div class="np-scroll" id="npBody"></div>
    </aside>

  </div>

  <footer class="player" id="player" aria-label="المشغل">
    <div class="player-mini-progress" id="miniProgress" aria-hidden="true"><span></span></div>

    <div class="np-brief">
      <button class="np-art" data-action="open-track" aria-label="عرض صفحة الأغنية" data-i18n-aria="track.fullPage">
        <div class="cover" id="pArt" aria-hidden="true"></div>
        <span class="np-art-expand" aria-hidden="true"><svg aria-hidden="true"><use href="#i-chevron-up"></use></svg></span>
      </button>
      <div class="np-text">
        <button class="np-title" data-action="open-track" id="pTitleBtn">
          <span id="pTitle" class="clamp-1"></span>
          <span class="mark" id="pMark" hidden>SYNTH</span>
        </button>
        <div class="np-artist clamp-1" id="pArtist" data-action="open-track" style="cursor:pointer"></div>
      </div>
      <button class="icon-btn np-like" data-action="like" id="pLike" aria-label="حفظ في الأغاني المعجب بها" aria-pressed="false" data-i18n-aria="player.like">
        <svg aria-hidden="true" id="pLikeIcon"><use href="#i-heart"></use></svg>
      </button>
    </div>

    <div class="player-mid">
      <div class="player-controls">
        <button class="ctrl" data-action="shuffle" id="bShuffle" aria-label="تشغيل عشوائي" aria-pressed="false" data-i18n-aria="player.shuffle">
          <svg aria-hidden="true"><use href="#i-shuffle"></use></svg>
        </button>
        <button class="ctrl" data-action="prev" aria-label="السابق" data-i18n-aria="player.prev">
          <svg aria-hidden="true"><use href="#i-prev"></use></svg>
        </button>
        <button class="play-btn" data-action="toggle" id="bPlay" aria-label="تشغيل" data-i18n-aria="player.play">
          <svg aria-hidden="true" id="pPlayIcon"><use href="#i-play"></use></svg>
        </button>
        <button class="ctrl" data-action="next" aria-label="التالي" data-i18n-aria="player.next">
          <svg aria-hidden="true"><use href="#i-next"></use></svg>
        </button>
        <button class="ctrl" data-action="repeat" id="bRepeat" aria-label="تكرار: متوقف" aria-pressed="false" data-i18n-aria="player.repeat">
          <svg aria-hidden="true"><use href="#i-repeat"></use></svg>
          <span class="badge" id="repeatBadge" hidden>1</span>
        </button>
      </div>
      <div class="seek-row" dir="ltr">
        <span class="time" id="pCur">0:00</span>
        <div class="seek" id="pSeek" role="slider" tabindex="0" aria-label="موضع التشغيل" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00" data-i18n-aria="player.seek">
          <div class="seek-track"><div class="seek-fill" id="pFill"></div><div class="seek-thumb"></div></div>
        </div>
        <span class="time end" id="pDur">0:00</span>
      </div>
    </div>

    <div class="player-end">
      <button class="ctrl" data-action="open-track" aria-label="الكلمات" data-i18n-aria="player.lyrics">
        <svg aria-hidden="true"><use href="#i-lyrics"></use></svg>
      </button>
      <button class="ctrl hide-md" data-action="toggle-panel" aria-label="لوحة الانتظار" data-i18n-aria="player.queue">
        <svg aria-hidden="true"><use href="#i-queue"></use></svg>
      </button>
      <button class="ctrl" data-action="mute" id="bMute" aria-label="كتم الصوت" aria-pressed="false" data-i18n-aria="player.mute">
        <svg aria-hidden="true" id="muteIcon"><use href="#i-volume"></use></svg>
      </button>
      <input class="volume" id="vol" type="range" min="0" max="100" value="70" step="1" aria-label="مستوى الصوت" data-i18n-aria="player.volume">
      <button class="ctrl" data-action="open-track" aria-label="صفحة الأغنية الكاملة" data-i18n-aria="track.fullPage">
        <svg aria-hidden="true"><use href="#i-expand"></use></svg>
      </button>
    </div>

    <button class="play-btn player-play-mobile" data-action="toggle" aria-label="تشغيل" data-i18n-aria="player.play">
      <svg aria-hidden="true" id="pPlayIconMini"><use href="#i-play"></use></svg>
    </button>
  </footer>

  <nav class="tabbar" aria-label="التنقل السفلي">
    <button class="tab is-active" data-action="go" data-view="home" data-nav="home">
      <svg aria-hidden="true"><use href="#i-home"></use></svg><span data-i18n="nav.home">الرئيسية</span>
    </button>
    <button class="tab" data-action="go" data-view="search" data-nav="search">
      <svg aria-hidden="true"><use href="#i-search"></use></svg><span data-i18n="nav.search">بحث</span>
    </button>
    <button class="tab" data-action="go" data-view="library" data-nav="library">
      <svg aria-hidden="true"><use href="#i-library"></use></svg><span data-i18n="nav.library">مكتبتك</span>
    </button>
    <button class="tab" data-action="go" data-view="studio" data-nav="studio">
      <svg aria-hidden="true"><use href="#i-sliders"></use></svg><span data-i18n="nav.studio">الاستوديو</span>
    </button>
  </nav>

</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-inner">
    <div class="sheet-side">
      <div class="sheet-glow" id="shGlow" aria-hidden="true"></div>
      <div class="cover" id="shArt" aria-hidden="true"></div>
      <div class="sheet-side-meta">
        <h2 id="shTitleMobile"></h2>
        <p id="shArtistMobile"></p>
      </div>
    </div>
    <div class="sheet-main">
      <div class="sheet-top">
        <div>
          <small data-i18n="sheet.from">يُشغَّل من مكتبتك</small>
          <div class="muted" style="font-size:11.5px" id="shAlbum"></div>
        </div>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="icon-btn" data-action="sheet-tab" data-tab="queue" aria-label="قائمة الانتظار" data-i18n-aria="player.queue">
            <svg aria-hidden="true"><use href="#i-queue"></use></svg>
          </button>
          <button class="icon-btn" data-action="close-sheet" aria-label="إغلاق المشغل" data-i18n-aria="player.close">
            <svg aria-hidden="true"><use href="#i-chevron-down"></use></svg>
          </button>
        </div>
      </div>
      <div class="sheet-body">
        <div class="sheet-title-block">
          <div style="min-width:0;flex:1">
            <h2 class="sheet-title" id="sheetTitle"></h2>
            <p class="sheet-artist" id="shArtist"></p>
          </div>
          <button class="icon-btn np-like" data-action="like" id="shLike" aria-label="إعجاب">
            <svg aria-hidden="true" id="shLikeIcon"><use href="#i-heart"></use></svg>
          </button>
        </div>
        <div class="sheet-seek" dir="ltr">
          <div class="seek" id="shSeek" role="slider" tabindex="0" aria-label="موضع التشغيل" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00">
            <div class="seek-track"><div class="seek-fill" id="shFill"></div><div class="seek-thumb"></div></div>
          </div>
          <div class="seek-row" style="margin-top:4px">
            <span class="time" id="shCur">0:00</span>
            <span style="flex:1"></span>
            <span class="time end" id="shDur">0:00</span>
          </div>
        </div>
        <div class="sheet-controls">
          <button class="ctrl" data-action="shuffle" id="shShuffle" aria-label="تشغيل عشوائي" aria-pressed="false" data-i18n-aria="player.shuffle">
            <svg aria-hidden="true"><use href="#i-shuffle"></use></svg>
          </button>
          <div class="center">
            <button class="ctrl" data-action="prev" aria-label="السابق" data-i18n-aria="player.prev"><svg aria-hidden="true"><use href="#i-prev"></use></svg></button>
            <button class="play-btn is-lg" data-action="toggle" id="shPlay" aria-label="تشغيل" data-i18n-aria="player.play">
              <svg aria-hidden="true" id="shPlayIcon"><use href="#i-play"></use></svg>
            </button>
            <button class="ctrl" data-action="next" aria-label="التالي" data-i18n-aria="player.next"><svg aria-hidden="true"><use href="#i-next"></use></svg></button>
          </div>
          <button class="ctrl" data-action="repeat" id="shRepeat" aria-label="تكرار" aria-pressed="false" data-i18n-aria="player.repeat">
            <svg aria-hidden="true"><use href="#i-repeat"></use></svg>
          </button>
        </div>
        <div class="sheet-tabs" role="tablist" aria-label="تفاصيل التشغيل">
          <button class="sheet-tab" role="tab" data-action="sheet-tab" data-tab="player" aria-selected="true" data-i18n="sheet.player">المشغل</button>
          <button class="sheet-tab" role="tab" data-action="sheet-tab" data-tab="lyrics" aria-selected="false" data-i18n="sheet.lyrics">الكلمات</button>
          <button class="sheet-tab" role="tab" data-action="sheet-tab" data-tab="queue" aria-selected="false" data-i18n="sheet.queue">الانتظار</button>
          <button class="sheet-tab" role="tab" data-action="sheet-tab" data-tab="about" aria-selected="false" data-i18n="sheet.about">عن الأغنية</button>
        </div>
        <div id="sheetPanel"></div>
      </div>
    </div>
  </div>
</dialog>

<dialog class="dlg" id="newPlDlg" aria-labelledby="npTitle">
  <div class="dlg-head">
    <h2 id="npTitle" data-i18n="rail.new">قائمة جديدة</h2>
    <button class="icon-btn is-small" data-action="close-dlg" aria-label="إغلاق" data-i18n-aria="common.close">
      <svg aria-hidden="true"><use href="#i-x"></use></svg>
    </button>
  </div>
  <form class="dlg-body" id="newPlForm">
    <label class="dlg-text" for="newPlName" data-i18n="playlist.nameLabel">اختر اسمًا قصيرًا يسهل تمييزه.</label>
    <input class="text-input" id="newPlName" type="text" maxlength="48" autocomplete="off" placeholder="اسم القائمة" data-i18n-ph="playlist.namePlaceholder" required>
    <div class="dlg-actions" style="margin-top:18px">
      <button type="button" class="btn" data-action="close-dlg" data-i18n="common.cancel">إلغاء</button>
      <button type="submit" class="btn btn-accent" data-i18n="common.create">إنشاء</button>
    </div>
  </form>
</dialog>

<dialog class="dlg" id="shortcutsDlg" aria-labelledby="scTitle">
  <div class="dlg-head">
    <h2 id="scTitle" data-i18n="shortcuts.title">اختصارات لوحة المفاتيح</h2>
    <button class="icon-btn is-small" data-action="close-dlg" aria-label="إغلاق" data-i18n-aria="common.close">
      <svg aria-hidden="true"><use href="#i-x"></use></svg>
    </button>
  </div>
  <div class="dlg-body">
    <div class="shortcut-list" id="shortcutList"></div>
  </div>
</dialog>

<dialog class="dlg" id="confirmDlg" aria-labelledby="cfTitle">
  <div class="dlg-head">
    <h2 id="cfTitle" data-i18n="studio.resetTitle">إعادة ضبط الاستوديو</h2>
    <button class="icon-btn is-small" data-action="close-dlg" aria-label="إغلاق" data-i18n-aria="common.close">
      <svg aria-hidden="true"><use href="#i-x"></use></svg>
    </button>
  </div>
  <div class="dlg-body">
    <p class="dlg-text" id="cfText" data-i18n="studio.resetText">سيتم استعادة المظهر والقوائم الافتراضية وحذف التعديلات المحفوظة على هذا الجهاز.</p>
    <div class="dlg-actions">
      <button class="btn" data-action="close-dlg" data-i18n="common.cancel">إلغاء</button>
      <button class="btn btn-danger" data-action="reset-confirm" data-i18n="studio.resetConfirm">استعادة الافتراضي</button>
    </div>
  </div>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

<div id="ytPlayerContainer" style="position:fixed;bottom:-9999px;left:-9999px;width:320px;height:240px;pointer-events:none;opacity:0.001;" aria-hidden="true">
  <div id="ytFrame"></div>
</div>

<input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac" multiple hidden>

<noscript>
  <p style="padding:24px;text-align:center;color:#ccc">هذا التطبيق يحتاج JavaScript للتشغيل.</p>
</noscript>

<!--INLINE_SCRIPTS-->
</body>
</html>
