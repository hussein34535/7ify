<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>media probe</title></head>
<body data-status="pending">
<img id="img" src="https://is1-ssl.mzstatic.com/image/thumb/Music69/v4/31/4d/d4/314dd42d-3246-e7a3-107a-3d521fa9a7e2/dj.iiicnpub.jpg/600x600bb.jpg" width="40" height="40">
<audio id="a" preload="auto" src="https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/5e/df/09/5edf0981-ce52-4740-f0b2-f6ad0760afcb/mzaf_17144740537777531434.plus.aac.p.m4a"></audio>
<div id="out">pending</div>
<script>
const img = document.getElementById('img');
const a = document.getElementById('a');
const out = document.getElementById('out');
img.onload = () => { document.body.dataset.img = String(img.naturalWidth); };
img.onerror = () => { document.body.dataset.img = 'ERR'; };
a.addEventListener('loadedmetadata', () => { document.body.dataset.dur = String(a.duration); });
a.addEventListener('error', () => { document.body.dataset.play = 'ERR:' + (a.error ? a.error.code : '?'); });
a.play().then(() => { document.body.dataset.play = 'ok'; }).catch((e) => { document.body.dataset.play = 'ERR:' + e.name; });
setTimeout(() => {
  document.body.dataset.pos = a.currentTime.toFixed(2);
  out.textContent = JSON.stringify(document.body.dataset);
}, 2600);
</script>
</body></html>
